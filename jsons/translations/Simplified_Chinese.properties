C++ can be used for procedural programming in C language, object-oriented programming characterized by abstract data types, and object-oriented programming characterized by inheritance and polymorphism. C++ excels in object-oriented programming and can also perform procedural programming. C++ can create almost any type of program: games, device drivers HPC、 Cloud, desktop, embedded, and mobile applications, etc. Even libraries and compilers used for other programming languages are written in C++. = C++可以用于C语言的过程式编程、以抽象数据类型为特征的面向对象编程以及以继承和多态为特征的面向对象编程。C++擅长面向对象编程，也可以进行过程式编程。C++几乎可以创建任何类型的程序：游戏、设备驱动程序HPC、云、桌面、嵌入式和移动应用程序等。甚至用于其他编程语言的库和编译器都是用C++编写的。

