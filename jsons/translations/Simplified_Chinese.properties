################ Techs #############

Hello World = 你好，世界
"Hello, World!" is the traditional first program of a new language. Print the greeting, and the journey begins. = “Hello, World!”是每种新语言传统的第一个程序。打印问候，旅程就此开始。
Internet = 互联网
The Internet, also known as the Net, is a global system of interconnected computer networks that use the Internet protocol suite (TCP/IP) to communicate between networks and devices. = 互联网，也称为网络，是一个全球互连的计算机网络系统，使用互联网协议套件（TCP/IP）在网络和设备之间进行通信。

------------

Website = 网站
A website is a collection of web pages and related content that is identified by a common domain name and published on at least one web server. = 网站是由网页和相关内容组成的集合，这些内容由一个共同的域名标识，并发布在至少一个网络服务器上。

Sequential Structure = 顺序结构
Sequential structure is the simplest and most commonly used program structure, as long as the corresponding statements are written in the order of solving the problem. Its execution order is top-down and sequential. = 顺序结构是最简单的程序结构，也是最常用的程序结构，只要按照解决问题的顺序写出相应的语句就行，它的执行顺序是自上而下，依次执行。

Selection Structure = 选择结构
The core of selection structure is to form conditional judgments through relational expressions and logical expressions, and the result is determined by Boolean values to determine the branch path. = 选择结构的核心是通过关系表达式和逻辑表达式组成条件判断，结果以布尔值决定分支路径。

Iteration Structure = 循环结构
Iteration structure refers to a program structure that needs to be repeatedly executed to determine whether to continue or exit the loop based on the conditions in the loop body. = 循环结构是指在程序中需要反复执行某个功能而设置的一种程序结构，根据循环体中的条件，判断继续执行某个功能还是退出循环。

Binary System = 二进制
A method of counting and carrying. There are only two digits, 0 and 1, and one digit is carried for every 2. It is mostly used in electronic computers. = 计数进位法之一。只有0和1两个数码，每满2则进一位，较多用于电子计算机上。

------------

Array = 数组
An array is a data structure that contains a group of elements. Typically, these elements are all of the same data type, such as an integer or string. = 数组是一种包含一组元素的数据结构。通常，这些元素都是相同的数据类型，例如整数或字符串。

Function = 函数
A function is a block of organized, reusable code that is used to perform a single, related action. Functions provide better modularity for your application and a high degree of code reusing. = 函数是一段有组织的、可重用的代码块，用于执行单个相关操作。函数为您的应用程序提供了更好的模块化和高度的代码重用。

Code = 代码
Code is a set of instructions written in a programming language that a computer can understand and execute. = 代码是一组用编程语言编写的指令，计算机可以理解和执行。

Von Neumann System = 冯·诺依曼体系
Von Neumann system: The number system of digital computers adopts binary and computers should execute programs in sequence. = 冯诺依曼体系：数字计算机的数制采用二进制；计算机应该按照程序顺序执行。

Linear Algebra = 线性代数
Linear algebra is the branch of mathematics concerning linear equations, linear functions, and their representations through matrices and vector spaces. = 线性代数是研究线性方程、线性函数及其通过矩阵和向量空间表示的数学分支。

------------

Network Protocol = 网络协议
A network protocol is a set of rules and conventions for communication between network devices. It defines how data is formatted, transmitted, and received over a network. = 网络协议是一组用于网络设备之间通信的规则和约定。它定义了数据在网络上的格式、传输和接收方式。

Pointer = 指针
A pointer is a variable that stores the memory address of another variable. Pointers are used to manipulate data in memory directly. = 指针是一种存储另一个变量内存地址的变量，用于直接操作内存中的数据。

Character String = 字符串
A string is a sequence of characters, either as a literal constant or as some kind of variable. The latter may allow its elements to be mutated and the length changed, or it may be fixed (after creation). = 字符串是字符的序列，可以是字面常量，也可以是某种变量。后者可能允许其元素被改变且长度可变，或者它可能是固定的（创建后）。

Assembly Language = 汇编语言
Assembly language is a low-level programming language that uses symbolic code and is specific to a computer architecture. It is converted into machine language using an assembler. = 汇编语言是一种使用符号代码的低级编程语言，特定于计算机体系结构。它使用汇编器转换为机器语言。

Processor Architecture = 处理器体系结构
Processor architecture refers to the design and organization of a computer's central processing unit (CPU), including its instruction set, data paths, and control unit. = 处理器架构是指计算机中央处理单元（CPU）的设计和组织，包括其指令集、数据路径和控制单元。

------------

Class and Object = 类与对象
A class is a blueprint for creating objects, providing initial values for state (member variables or attributes), and implementations of behavior (member functions or methods). = 类是创建对象的蓝图，为状态（成员变量或属性）提供初始值，并实现行为（成员函数或方法）。

Stack and Queue = 栈和队列
A stack is a linear data structure that follows the Last In First Out (LIFO) principle, while a queue follows the First In First Out (FIFO) principle. = 栈是一种遵循后进先出（LIFO）原则的线性数据结构，而队列遵循先进先出（FIFO）原则。

Operating System = 操作系统
An operating system (OS) is system software that manages computer hardware and software resources and provides common services for computer programs. = 操作系统（OS）是管理计算机硬件和软件资源并为计算机程序提供常用服务的系统软件。

Moore's Law = 摩尔定律
Moore's Law is the observation that the number of transistors in a dense integrated circuit doubles about every two years. = 摩尔定律：集成电路上可容纳的晶体管数量每隔约两年就会增加一倍。

------------

Memory Release = 内存释放
Memory release refers to the technical means of releasing data residing in memory to improve the utilization and performance of system memory resources. = 内存释放是指将驻留在内存中的数据释放出来以提高系统内存资源利用率和性能的技术手段。

Basic Algorithm = 算法基础
The algorithm describes a process in which a computation can start from an initial state and initial input, go through a series of finite and clearly defined states, and ultimately produce an output that stops at a final state. = 算法描述的是一个计算运行时能从一个初始状态和初始输入开始，经过一系列有限且清晰定义的状态，最终产生输出并停止于一个终态的过程。

Memory Architecture = 存储器体系结构
The memory architecture covers the connection mode between storage devices and computer systems, and has developed through bus storage, storage networks, and virtual storage stages. = 存储器体系结构涵盖存储设备与计算机系统的连接模式，发展历经总线存储、存储网络和虚拟存储阶段。

Discrete Mathematics = 离散数学
Discrete mathematics is the study of mathematical structures that are fundamentally discrete rather than continuous, including graphs, sets, and logic. = 离散数学研究本质上是离散而非连续的数学结构，包括图、集合与逻辑。

Boolean Algebra = 布尔代数
Boolean algebra is the branch of algebra in which the values of the variables are true and false, usually denoted 1 and 0, and the operations are AND, OR, and NOT. = 布尔代数是变量取值为真或假（通常记为 1 和 0）、运算为与、或、非的代数分支。

Circuit Principles = 电路原理
Circuit principles describe how logic gates are built from transistors and combined into the integrated circuits at the heart of every computer. = 电路原理描述如何用晶体管构建逻辑门，并把它们组合成每台计算机核心处的集成电路。

Machine Language = 机器语言
Machine language is the set of binary instructions a processor can execute directly, the lowest level of programming. = 机器语言是处理器能够直接执行的二进制指令集合，是编程的最低层次。

Babbage Engine = 巴贝奇分析机
Charles Babbage's Analytical Engine (1837) was the first general-purpose mechanical computer design, with a store, a mill, and punched-card input. = 查尔斯·巴贝奇的分析机（1837）是首个通用机械计算机设计，包含存储、运算与穿孔卡片输入。

Turing Machine = 图灵机
Alan Turing's 1936 abstract machine formalized computation and showed that some problems are undecidable. = 艾伦·图灵于 1936 年提出的抽象机器形式化了计算，并证明了某些问题是不可判定的。

Computability Theory = 可计算性理论
The Church-Turing thesis established that all reasonable models of computation are equivalent. = 丘奇-图灵论题表明，所有合理的计算模型都是等价的。

Computer Graphics = 计算机图形学
Computer graphics turned linear algebra into images, from rasterization and shading to ray tracing. = 计算机图形学把线性代数变成图像，从光栅化、着色到光线追踪。

Cybersecurity = 网络安全
As networks spread, security became a discipline of firewalls, encryption, and intrusion detection. = 随着网络普及，安全成为一门由防火墙、加密与入侵检测构成的学科。

Algorithm Complexity = 算法复杂度
Big-O notation and complexity classes compare algorithms by how their resource use grows with input. = 大 O 记号和复杂度类按资源随输入规模的增长来比较算法。

Computer Vision = 计算机视觉
Computer vision teaches machines to interpret images, from edge detection to convolutional networks. = 计算机视觉让机器理解图像，从边缘检测到卷积网络。

Cryptography = 密码学
Public-key cryptography made secure communication possible over untrusted networks. = 公钥密码学使不可信网络上的安全通信成为可能。

Complexity Theory = 计算复杂性理论
Complexity theory classifies problems by the resources needed to solve them, from P and NP to PSPACE. = 计算复杂性理论按求解问题所需资源对问题分类，从 P、NP 到 PSPACE。

Machine Learning = 机器学习
Machine learning builds models that improve from data instead of relying only on hand-written rules. = 机器学习让模型从数据中改进，而不再只依赖手写规则。

Blockchain = 区块链
The 2008 Bitcoin whitepaper introduced a distributed ledger secured by cryptography and proof-of-work. = 2008 年的比特币白皮书提出了由密码学与工作量证明保障的分布式账本。

Quantum Computing = 量子计算
Quantum computers exploit superposition and entanglement to solve certain problems exponentially faster than classical machines. = 量子计算机利用叠加与纠缠，在某些问题上比经典计算机快指数级。

Compiler Theory = 编译原理
Compiler theory formalized parsing, optimization, and code generation from high-level languages to machine code. = 编译原理形式化了从高级语言到机器码的解析、优化与代码生成。

Artificial Intelligence = 人工智能
The 1956 Dartmouth workshop founded artificial intelligence as a field of computer science. = 1956 年的达特茅斯会议标志着人工智能作为计算机科学领域的诞生。

Post-Quantum Cryptography = 后量子密码学
Post-quantum cryptography designs algorithms that remain secure against attacks by quantum computers. = 后量子密码学设计能够抵御量子计算机攻击的算法。

Quantum Algorithms = 量子算法
Shor's and Grover's algorithms demonstrated quantum speedups for factoring and searching. = Shor 与 Grover 算法展示了量子在因数分解与搜索上的加速。

Formal Verification = 形式化验证
Formal methods use logic and proof to show that hardware and software meet their specifications. = 形式化方法用逻辑与证明来确保硬件和软件符合规范。

Logic Synthesis = 逻辑综合
Logic synthesis automates the translation of Boolean specifications into gate-level circuits. = 逻辑综合自动把布尔规格转换为门级电路。

Computer Architecture = 计算机体系结构
Pipelining, caching, and superscalar execution shaped the design of modern processors. = 流水线、缓存与超标量执行塑造了现代处理器的设计。

Deep Learning = 深度学习
Deep neural networks and backpropagation brought breakthroughs in vision, speech, and language. = 深度神经网络与反向传播带来了视觉、语音和语言领域的突破。

Natural Language Processing = 自然语言处理
Natural language processing taught computers to parse, translate, and generate human language. = 自然语言处理让计算机能够解析、翻译并生成人类语言。

Future Tech = 未来科技
The future is not yet written. Keep researching to see what comes next. = 未来尚未写定，继续研究，看看接下来会发生什么。

