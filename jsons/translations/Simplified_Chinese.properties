Python = Python
Guido van Rossum = 吉多·范罗苏姆

Python was designed by Guido van Rossum of the Dutch National Centre for Mathematics and Computer Science in the early 1990s as an alternative to a language called ABC. Python provides efficient advanced data structures and enables simple and effective object-oriented programming. = Python由荷兰数学与计算机科学国家研究中心的Guido van Rossum于1990年代初设计，作为一种名为ABC语言的替代品。Python提供高效的高级数据结构，并实现了简单有效的面向对象编程。

The syntax and dynamic typing of Python, as well as the nature of interpreted languages, make it a programming language for scripting and rapid application development on most platforms. With the continuous updates of versions and the addition of new language features, it is gradually being used for independent, large-scale project development. = Python的语法和动态类型，以及解释型语言的特性，使其成为一种适用于大多数平台的脚本编写和快速应用程序开发的编程语言。随着版本的不断更新和新语言特性的增加，它正逐渐被用于独立的大型项目开发。

